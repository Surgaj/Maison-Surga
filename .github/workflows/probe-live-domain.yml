name: Probe Maison Surga Live Domains
on:
  push:
    paths:
      - ".github/workflows/probe-live-domain.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Read GitHub Pages status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api /repos/${{ github.repository }}/pages || true

      - name: Probe DNS and HTTPS
        shell: bash
        run: |
          set +e
          echo "WWW_DNS"
          dig +short www.maisonsurga.com
          echo "APEX_DNS"
          dig +short maisonsurga.com
          echo "CHECKOUT_DNS"
          dig +short checkout.maisonsurga.com
          echo "WWW_HTTPS"
          curl -LIsS --max-time 20 https://www.maisonsurga.com/ | head -20
          echo "WWW_HTTPS_INSECURE_PROBE"
          curl -kLIsS --max-time 20 https://www.maisonsurga.com/ | head -20
          echo "APEX_HTTPS"
          curl -LIsS --max-time 20 https://maisonsurga.com/ | head -20
          echo "CHECKOUT_HTTPS"
          curl -LIsS --max-time 20 https://checkout.maisonsurga.com/ | head -20

# launch probe refreshed 2026-09-23
