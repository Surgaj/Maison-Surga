name: Test Maison Surga Browser
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-wix-cors.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages
        run: sleep 20
      - name: Install CDP helper
        run: pip install websocket-client
      - name: Test live product and cart click
        run: |
          google-chrome --headless --no-sandbox --disable-gpu --remote-allow-origins='*' --remote-debugging-port=9222 about:blank >/tmp/chrome.log 2>&1 &
          sleep 3
          python - <<'PY'
          import json,time,urllib.request,websocket
          target=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json/new?https://surgaj.github.io/Maison-Surga/product.html',data=b'',timeout=10))
          ws=websocket.create_connection(target['webSocketDebuggerUrl'],timeout=10)
          n=0
          def call(method,params=None):
              global n
              n+=1
              ws.send(json.dumps({'id':n,'method':method,'params':params or {}}))
              while True:
                  msg=json.loads(ws.recv())
                  if msg.get('id')==n:
                      return msg
          call('Runtime.enable')
          time.sleep(7)
          state1=call('Runtime.evaluate',{'expression':"JSON.stringify({price:document.getElementById('product-price')?.textContent,add:document.getElementById('add-to-bag')?.textContent,disabled:document.getElementById('add-to-bag')?.disabled})",'returnByValue':True})
          print('STATE1',state1['result']['result'].get('value'))
          call('Runtime.evaluate',{'expression':"document.getElementById('add-to-bag')?.click()"})
          time.sleep(4)
          state2=call('Runtime.evaluate',{'expression':"JSON.stringify({bag:document.querySelector('.bag-count')?.textContent,dialog:document.getElementById('bag-dialog')?.open,content:document.getElementById('bag-content')?.innerText})",'returnByValue':True})
          print('STATE2',state2['result']['result'].get('value'))
          ws.close()
          PY
