name: Configure Maison Surga Custom Domain
on:
  push:
    paths:
      - ".github/workflows/configure-pages-domain.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Set GitHub Pages custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method PUT             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             /repos/${{ github.repository }}/pages             -f cname='www.maisonsurga.com'             -f build_type='workflow'
