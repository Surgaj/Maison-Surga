name: E2E Maison Surga Storefront
on:
  workflow_dispatch:
  push:
    paths:
      - "js/**"
      - "css/**"
      - "*.html"
      - ".github/workflows/e2e-storefront.yml"
concurrency:
  group: maison-surga-e2e
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages deployment
        run: sleep 35
      - name: Install browser test dependency
        run: npm install puppeteer-core@24
      - name: Test live product cart quantity checkout and account handoff
        run: |
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const assert = (ok,msg)=>{ if(!ok) throw new Error(msg); };
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:'/usr/bin/google-chrome',
              headless:true,
              args:['--no-sandbox','--disable-setuid-sandbox','--disable-gpu']
            });
            const page=await browser.newPage();
            await page.setViewport({width:390,height:844,deviceScaleFactor:1});
            const logs=[];
            page.on('console',m=>logs.push('console '+m.type()+': '+m.text()));
            page.on('pageerror',e=>logs.push('pageerror: '+e.message));
            page.on('requestfailed',r=>logs.push('requestfailed: '+r.url()+' '+(r.failure()?.errorText||'')));
            await page.goto('https://surgaj.github.io/Maison-Surga/product.html?e2e=cart-v18',{waitUntil:'networkidle2',timeout:60000});
            const storefrontUrl = new URL(page.url());
            assert(storefrontUrl.protocol==='https:','Storefront is not being served over HTTPS');
            assert(['surgaj.github.io','www.maisonsurga.com','maisonsurga.com'].includes(storefrontUrl.hostname),'Storefront resolved to an unexpected host');
            await page.waitForFunction(()=>document.querySelector('#add-to-bag')?.textContent.includes('Add to bag'),{timeout:30000});
            const initial=await page.evaluate(()=>({
              price:document.querySelector('#product-price')?.textContent,
              title:document.querySelector('#product-title')?.textContent,
              enabled:!document.querySelector('#add-to-bag')?.disabled
            }));
            console.log('INITIAL',initial);
            assert(initial.price==='£14.99','Live Wix price did not load');
            assert(initial.title==='Sonic Facial Cleansing Brush' && initial.enabled,'New Wix product did not load');
            await page.click('#add-to-bag');
            await page.waitForFunction(()=>document.querySelector('.bag-count')?.textContent==='(1)',{timeout:20000});
            const afterAdd=await page.evaluate(()=>({
              bag:document.querySelector('.bag-count')?.textContent,
              dialog:document.querySelector('#bag-dialog')?.open,
              content:document.querySelector('#bag-content')?.innerText,
              checkout:!!document.querySelector('.bag-checkout')
            }));
            console.log('AFTER_ADD',afterAdd);
            assert(afterAdd.dialog && afterAdd.checkout,'Bag did not render after Add to bag');
            assert(afterAdd.content.includes('Sonic Facial Cleansing Brush'),'New Wix product missing from bag');

            await page.evaluate(()=>document.querySelector('#bag-dialog')?.close());
            await page.click('[data-dialog="bag-dialog"]');
            await page.waitForFunction(()=>document.querySelector('#bag-content')?.innerText.includes('Sonic Facial Cleansing Brush'),{timeout:10000});
            console.log('REOPEN_BAG',await page.evaluate(()=>({
              bag:document.querySelector('.bag-count')?.textContent,
              content:document.querySelector('#bag-content')?.innerText
            })));

            await page.click('[data-cart-action="increase"]');
            await page.waitForFunction(()=>document.querySelector('.bag-count')?.textContent==='(2)',{timeout:20000});
            console.log('AFTER_QTY',await page.evaluate(()=>({
              bag:document.querySelector('.bag-count')?.textContent,
              content:document.querySelector('#bag-content')?.innerText
            })));

            await page.reload({waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('.bag-count')?.textContent==='(2)',{timeout:20000});
            await page.click('[data-dialog="bag-dialog"]');
            await page.waitForFunction(()=>document.querySelector('#bag-content')?.innerText.includes('Sonic Facial Cleansing Brush'),{timeout:10000});
            console.log('PERSISTENCE',await page.evaluate(()=>({
              bag:document.querySelector('.bag-count')?.textContent,
              content:document.querySelector('#bag-content')?.innerText
            })));

            const checkoutHref = await page.evaluate(async()=>{
              const cart = await window.MaisonWix.getCurrentCart();
              return window.MaisonWix.getCheckoutUrl(cart.id);
            });
            console.log('CHECKOUT_URL',checkoutHref);
            assert(/^https:\/\//.test(checkoutHref||''),'Wix checkout URL was not returned');
            const checkoutPage=await browser.newPage();
            const checkoutResponse=await checkoutPage.goto(checkoutHref,{waitUntil:'domcontentloaded',timeout:60000});
            await new Promise(r=>setTimeout(r,3000));
            const checkoutState={status:checkoutResponse?.status(),url:checkoutPage.url(),title:await checkoutPage.title()};
            console.log('CHECKOUT_PAGE',checkoutState);
            assert(new URL(checkoutPage.url()).hostname==='checkout.maisonsurga.com','Checkout did not move to checkout.maisonsurga.com');
            await new Promise(r=>setTimeout(r,5000));
            const checkoutText=(await checkoutPage.evaluate(()=>document.body.innerText)).slice(0,5000);
            console.log('CHECKOUT_TEXT',checkoutText);
            assert(!/We can’t accept online payments/i.test(checkoutText),'Premium Wix backend is not accepting online payments');
            assert((checkoutState.status||500)<400,'Wix hosted checkout did not load');
            assert(checkoutState.url.includes('/checkout'),'Checkout handoff did not reach Wix checkout');
            assert(/Checkout/i.test(checkoutState.title||''),'Wix checkout page title did not load');
            await checkoutPage.close();

            await page.click('[data-cart-action="decrease"]');
            await page.waitForFunction(()=>document.querySelector('.bag-count')?.textContent==='(1)',{timeout:20000});
            await page.click('[data-cart-action="remove"]');
            await page.waitForFunction(()=>document.querySelector('.bag-count')?.textContent==='(0)',{timeout:20000});
            console.log('AFTER_REMOVE',await page.evaluate(()=>({bag:document.querySelector('.bag-count')?.textContent,content:document.querySelector('#bag-content')?.innerText})));
            assert((await page.$('.bag-checkout'))===null,'Checkout button remained after cart emptied');

            await page.evaluate(()=>document.querySelector('#bag-dialog')?.close());
            await page.click('.hamburger');
            const accountMobile=await page.evaluate(()=>({
              menuOpen:document.querySelector('#primary-navigation')?.classList.contains('open'),
              accountVisible:getComputedStyle(document.querySelector('.mobile-nav-account')).display
            }));
            console.log('MOBILE_NAV',accountMobile);
            assert(accountMobile.menuOpen && accountMobile.accountVisible!=='none','Mobile account navigation failed');

            await page.evaluate(()=>document.querySelector('.mobile-nav-account')?.click());
            await new Promise(r=>setTimeout(r,3500));
            const account=await page.evaluate(()=>({
              dialog:document.querySelector('#account-dialog')?.open,
              content:document.querySelector('#account-content')?.innerText,
              login:!!document.querySelector('.account-login')
            }));
            console.log('ACCOUNT',account);
            assert(account.dialog && account.login,'Managed account login button did not render');

            const loginPage=await browser.newPage();
            await loginPage.goto('https://surgaj.github.io/Maison-Surga/index.html?e2e=managed-login',{waitUntil:'networkidle2',timeout:60000});
            await loginPage.evaluate(()=>window.MaisonWix.startLogin());
            await new Promise(r=>setTimeout(r,7000));
            const managedLogin={url:loginPage.url(),title:await loginPage.title(),text:(await loginPage.evaluate(()=>document.body.innerText)).slice(0,1800)};
            assert(new URL(managedLogin.url).hostname==='checkout.maisonsurga.com','Managed login did not move to checkout.maisonsurga.com');
            console.log('MANAGED_LOGIN',managedLogin);
            assert(managedLogin.url.includes('maisonsurga.com') || managedLogin.url.includes('auth-callback.html'),'Managed sign-in did not hand off to Wix');
            await loginPage.close();

            const desktop=await browser.newPage();
            await desktop.setViewport({width:1440,height:900,deviceScaleFactor:1});
            await desktop.goto('https://surgaj.github.io/Maison-Surga/index.html?e2e=desktop-account-v18',{waitUntil:'networkidle2',timeout:60000});
            await desktop.click('.account-button');
            await desktop.waitForFunction(()=>document.querySelector('#account-dialog')?.open,{timeout:10000});
            const desktopAccount=await desktop.evaluate(()=>({
              content:document.querySelector('#account-content')?.innerText,
              login:!!document.querySelector('#account-content .account-login')
            }));
            console.log('DESKTOP_ACCOUNT',desktopAccount);
            assert(desktopAccount.login,'Desktop account icon did not render the secure sign-in button');
            assert(!/Checking your account/i.test(desktopAccount.content||''),'Desktop account remained stuck on loading state');
            await desktop.close();

            await page.goto('https://surgaj.github.io/Maison-Surga/index.html?e2e=nav-v18',{waitUntil:'networkidle2',timeout:60000});
            await page.click('[data-dialog="search-dialog"]');
            await page.type('#search-input','brush');
            await page.waitForFunction(()=>document.querySelector('#search-results')?.innerText.includes('Facial Cleansing Brush'),{timeout:10000});
            console.log('SEARCH_OK',await page.evaluate(()=>document.querySelector('#search-results')?.innerText));
            await page.evaluate(()=>document.querySelector('#search-dialog')?.close());

            await page.goto('https://surgaj.github.io/Maison-Surga/collection.html?category=skincare&e2e=favourites-v18',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>document.querySelectorAll('.product-card').length>=4,{timeout:30000});
            const firstFavId=await page.evaluate(()=>document.querySelector('.product-card')?.dataset.productId);
            await page.click('.product-card-favourite');
            const favSaved=await page.evaluate(id=>({
              pressed:document.querySelector('[data-favourite-id="'+id+'"]')?.getAttribute('aria-pressed'),
              stored:JSON.parse(localStorage.getItem('maisonSurgaFavouritesV1')||'[]').some(item=>item.id===id)
            }),firstFavId);
            console.log('FAVOURITE_SAVE',favSaved);
            assert(favSaved.pressed==='true' && favSaved.stored,'Favourite did not save');
            await page.reload({waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>document.querySelectorAll('.product-card').length>=4,{timeout:30000});
            const favPersisted=await page.evaluate(id=>document.querySelector('[data-favourite-id="'+id+'"]')?.getAttribute('aria-pressed'),firstFavId);
            console.log('FAVOURITE_PERSISTENCE',favPersisted);
            assert(favPersisted==='true','Favourite did not persist across reload');
            await page.evaluate(id=>document.querySelector('[data-favourite-id="'+id+'"]')?.click(),firstFavId);
            await new Promise(r=>setTimeout(r,600));
            const favRemoved=await page.evaluate(id=>!JSON.parse(localStorage.getItem('maisonSurgaFavouritesV1')||'[]').some(item=>item.id===id),firstFavId);
            assert(favRemoved,'Favourite did not remove');

            for(const category of ['skincare','tools','makeup','selfcare']){
              await page.goto('https://surgaj.github.io/Maison-Surga/collection.html?category='+category,{waitUntil:'networkidle2',timeout:60000});
              await page.waitForFunction(()=>document.querySelectorAll('.product-card').length>=4,{timeout:30000});
              const navState=await page.evaluate(()=>({
                title:document.title,
                h1:document.querySelector('#collection-content h1')?.textContent,
                url:location.href,
                cards:document.querySelectorAll('.product-card').length,
                internal:[...document.querySelectorAll('.product-card')].every(a=>a.getAttribute('href')?.startsWith('product.html?id='))
              }));
              console.log('CATEGORY_'+category.toUpperCase(),navState);
              const categoryUrl=new URL(navState.url);
              assert(categoryUrl.protocol==='https:' && ['surgaj.github.io','www.maisonsurga.com','maisonsurga.com'].includes(categoryUrl.hostname) && categoryUrl.pathname.endsWith('/collection.html'),'Category left the HTTPS storefront');
              assert(navState.h1 && navState.cards>=4 && navState.internal,'Category catalog did not render real internal product cards');
            }

            await page.goto('https://surgaj.github.io/Maison-Surga/product.html?id=e9059439-4894-48cf-81b4-fe1bcfe3d6d1',{waitUntil:'networkidle2',timeout:60000});
            await page.waitForFunction(()=>document.querySelector('#product-title')?.textContent.includes('White Jade Roller'),{timeout:30000});
            const genericProduct=await page.evaluate(()=>({
              title:document.querySelector('#product-title')?.textContent,
              price:document.querySelector('#product-price')?.textContent,
              add:document.querySelector('#add-to-bag')?.textContent,
              images:document.querySelectorAll('#live-gallery img').length
            }));
            console.log('GENERIC_PRODUCT',genericProduct);
            assert(genericProduct.add==='Add to bag' && genericProduct.images>=1,'Generic Wix product page did not initialise');

            const wixHostPage=await browser.newPage();
            const wixJsResponse=await wixHostPage.goto('https://instant-xcmckphpywnv-jesussurgaes-140c.wix-site-host.com/js/wix-store.js',{waitUntil:'domcontentloaded',timeout:60000});
            const wixJsText=await wixHostPage.evaluate(()=>document.body.innerText);
            const wixHostProbe={
              status:wixJsResponse?.status(),
              newClient:wixJsText.includes('641c6446-c44e-434a-9b48-bc26624bdae0'),
              newProduct:wixJsText.includes('921a0414-d929-4e7f-ada1-c79234f22fe0'),
              oldClient:wixJsText.includes('4a256781-4f9d-4ae4-a7f6-2bcb9589c2fb')
            };
            console.log('WIX_HOST_FRONTEND',wixHostProbe);
            await wixHostPage.close();

            console.log('BROWSER_LOGS\n'+logs.join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
