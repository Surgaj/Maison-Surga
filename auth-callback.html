<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signing in — Maison Surga</title>
  <meta name="theme-color" content="#faf7f2">
  <link rel="icon" href="assets/monogram.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <main class="auth-callback-page">
    <img src="assets/logo.svg?v=2" alt="Maison Surga — Beauty Beyond Routine">
    <p class="eyebrow">YOUR MAISON SURGA</p>
    <h1 id="auth-title">Signing you in…</h1>
    <p id="auth-message">Securely completing your Wix member session.</p>
    <a id="auth-back" class="button dark" href="index.html" hidden>Back to Maison Surga <span>⟶</span></a>
  </main>
  <script src="js/wix-store.js?v=5"></script>
  <script>
    (async () => {
      const title = document.getElementById('auth-title');
      const message = document.getElementById('auth-message');
      const back = document.getElementById('auth-back');
      try {
        const returnTo = await window.MaisonWix.completeLoginFromCallback();
        title.textContent = 'Welcome back.';
        message.textContent = 'Your account is connected. Returning to Maison Surga…';
        setTimeout(() => location.replace(returnTo), 450);
      } catch (error) {
        console.error('[Maison Surga] login callback error', error);
        title.textContent = 'We could not complete sign in.';
        message.textContent = error.message || 'Please return to Maison Surga and try again.';
        back.hidden = false;
      }
    })();
  </script>
</body>
</html>
